# Every Studio page/API is privileged. Never publish studio:3000 or meta:8080.
server {
    listen 8001;
    server_name _;
    auth_basic "Supabase Studio administration";
    auth_basic_user_file /run/secrets/studio_htpasswd;

    location / {
        proxy_pass http://studio:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dashboard credentials authenticate at nginx, not at Studio/GoTrue.
        proxy_set_header Authorization "";
    }
}
