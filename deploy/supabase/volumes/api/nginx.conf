# Thin API gateway: maps the Supabase convention /auth/v1/* onto GoTrue, which
# serves its endpoints at the root. This is the single URL the dashboard's
# supabase-js and Hindsight's tenant extension point at.
server {
    listen 8000;
    server_name _;

    # GoTrue fetches these static email templates internally; they contain no secrets.
    location /auth/templates/ {
        alias /etc/nginx/auth-templates/;
    }

    # The dashboard (supabase-js) calls this cross-origin from the Control
    # Plane, so answer CORS here. Dev-only: reflect the caller's origin.
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        # GoTrue also sends Access-Control-Allow-Origin: * — strip it so the
        # response carries exactly one value (browsers reject duplicates).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version" always;

        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
