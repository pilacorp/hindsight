# Local full-stack multi-user Hindsight (API + Control Plane) for testing.
#
# Uses the custom images built from the pilacorp/hindsight fork:
#   hindsight-api-nda:dev        (tenant + HTTP extensions)
#   hindsight-cp-nda:dev         (forked Control Plane, per-user login)
#
# Against an EXTERNAL PostgreSQL/pgvector (no database service here). Reads
# everything from .env.multiuser. This is the local-test shape of the deployment
# that nda-harness#3 will formalize (pinned digests, bootstrap/verify scripts).

name: nda-hindsight-mu

services:
  api:
    image: ${HINDSIGHT_API_IMAGE:-hindsight-api-nda:dev}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_API_DATABASE_URL:?set in .env}
      HINDSIGHT_API_TENANT_KEY_PEPPER: ${HINDSIGHT_API_TENANT_KEY_PEPPER:?set in .env}
      HINDSIGHT_API_TENANT_EXTENSION: nda_hindsight_multiuser.tenant:NdaTenantExtension
      HINDSIGHT_API_HTTP_EXTENSION: nda_hindsight_multiuser.http:NdaHttpExtension
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in .env}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:?set in .env}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openrouter
      HINDSIGHT_API_EMBEDDINGS_OPENROUTER_MODEL: ${HINDSIGHT_EMBEDDINGS_MODEL:?set in .env}
      HINDSIGHT_API_RERANKER_PROVIDER: openrouter
      HINDSIGHT_API_RERANKER_OPENROUTER_MODEL: ${HINDSIGHT_RERANKER_MODEL:?set in .env}
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: ${HINDSIGHT_API_LLM_OUTPUT_LANGUAGE:-}
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-warning}
    ports:
      - "${HINDSIGHT_BIND_ADDRESS:-127.0.0.1}:${HINDSIGHT_API_PUBLISH_PORT:-8891}:8888"
    healthcheck:
      test: ["CMD", "python3", "-m", "hindsight_api.http_probe", "http://127.0.0.1:8888/health", "5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  control-plane:
    image: ${HINDSIGHT_CP_IMAGE:-hindsight-cp-nda:dev}
    restart: unless-stopped
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://api:8888
      HINDSIGHT_CP_SESSION_SECRET: ${HINDSIGHT_CP_SESSION_SECRET:?set in .env}
      HINDSIGHT_CP_HOSTNAME: 0.0.0.0
      HINDSIGHT_CP_PORT: "9999"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HINDSIGHT_BIND_ADDRESS:-127.0.0.1}:${HINDSIGHT_CP_PUBLISH_PORT:-9991}:9999"
