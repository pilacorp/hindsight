# Local full-stack Hindsight (API + Control Plane) for testing issue #10:
# tenancy via the upstream Supabase tenant extension, identity from a
# self-hosted open-source Supabase (Auth + Postgres). Supabase Cloud is not a
# target. There is NO database service here — HINDSIGHT_API_DATABASE_URL points
# at the Supabase stack's own Postgres (it provides `vector`).
#
# Images built from the pilacorp/hindsight fork:
#   hindsight-api-supabase:dev   (base + hindsight_ext_supabase_tenant)
#   hindsight-cp-nda:dev         (forked Control Plane, Supabase sign-in)
#
# The single API container runs the API and its in-process worker, so the
# Supabase tenant settings here cover both (a worker without the extension
# would leave tenant schemas unconsolidated).

name: nda-hindsight-supabase

services:
  api:
    image: ${HINDSIGHT_API_IMAGE:-hindsight-api-supabase:dev}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_API_DATABASE_URL:?set in .env}
      # Upstream Supabase tenant extension: schema-per-user from the Supabase JWT.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_ext_supabase_tenant:SupabaseTenantExtension
      HINDSIGHT_API_TENANT_SUPABASE_URL: ${HINDSIGHT_API_TENANT_SUPABASE_URL:?set in .env}
      # Only for legacy HS256 projects / startup health check; prefer JWKS (leave empty).
      HINDSIGHT_API_TENANT_SUPABASE_SERVICE_KEY: ${HINDSIGHT_API_TENANT_SUPABASE_SERVICE_KEY:-}
      HINDSIGHT_API_TENANT_SCHEMA_PREFIX: ${HINDSIGHT_API_TENANT_SCHEMA_PREFIX:-user}
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in .env}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:?set in .env}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openrouter
      HINDSIGHT_API_EMBEDDINGS_OPENROUTER_MODEL: ${HINDSIGHT_EMBEDDINGS_MODEL:?set in .env}
      HINDSIGHT_API_RERANKER_PROVIDER: openrouter
      HINDSIGHT_API_RERANKER_OPENROUTER_MODEL: ${HINDSIGHT_RERANKER_MODEL:?set in .env}
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: ${HINDSIGHT_API_LLM_OUTPUT_LANGUAGE:-}
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-warning}
    ports:
      - "${HINDSIGHT_BIND_ADDRESS:-127.0.0.1}:${HINDSIGHT_API_PUBLISH_PORT:-8891}:8888"
    healthcheck:
      test: ["CMD", "python3", "-m", "hindsight_api.http_probe", "http://127.0.0.1:8888/health", "5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  control-plane:
    image: ${HINDSIGHT_CP_IMAGE:-hindsight-cp-nda:dev}
    restart: unless-stopped
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://api:8888
      # Public (browser) Supabase client for dashboard sign-in + token refresh.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in .env}
      HINDSIGHT_CP_HOSTNAME: 0.0.0.0
      HINDSIGHT_CP_PORT: "9999"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HINDSIGHT_BIND_ADDRESS:-127.0.0.1}:${HINDSIGHT_CP_PUBLISH_PORT:-9991}:9999"
