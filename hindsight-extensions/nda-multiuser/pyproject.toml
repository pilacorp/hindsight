# Runs the tests, nothing else. Like the other extensions here, this package is
# not published to PyPI and not built into a wheel — it ships by copying
# nda_hindsight_multiuser/ into an image derived from Hindsight (see Dockerfile).
# `package = false` keeps uv from trying to build or install this directory.
[project]
name = "nda-hindsight-multiuser"
version = "0"
requires-python = ">=3.11"
dependencies = [
    # The server provides the extension interfaces and asyncpg this is written
    # against; a test-time dependency only (the server imports the extension at
    # runtime, it does not install it).
    "hindsight-api-slim",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv]
package = false

[tool.uv.sources]
hindsight-api-slim = { path = "../../hindsight-api-slim", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
